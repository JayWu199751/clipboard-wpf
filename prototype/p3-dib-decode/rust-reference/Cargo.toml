[package]
name = "dib-reference"
version = "0.1.0"
edition = "2021"
publish = false

# 参照生成器：只用于产出 legacy 基准 PNG（判据 3），不是交付产品。
# image 版本与 legacy Cargo.toml 相同（0.25，仅 png feature）。

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
sha1 = "0.10"
hex = "0.4"

[[bin]]
name = "dib-reference"
path = "src/main.rs"

# legacy dib.rs 原封复制，tests 模块引用 image 的测试工具，release 编译不需要
[profile.release]
panic = "abort"
